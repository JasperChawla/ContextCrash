server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # SPA routing - all non-asset paths go to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls to the backend container
    location /runs/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
    }
    location /results/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
    }
}
